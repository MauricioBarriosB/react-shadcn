services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"   # Host:Container port
    volumes:
      - .:/app             # Sync current directory
      - /app/node_modules  # Preserve container modules
      - /app/.vite         # Cache Vite build files
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - react-net

networks:
  react-net:
    driver: bridge